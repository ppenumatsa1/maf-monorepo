name: Underwriting Public Observability and Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: underwriting-foundry-public-release
  cancel-in-progress: false

jobs:
  observe:
    name: Validate observability and evaluation
    runs-on: ubuntu-latest
    environment: underwriting-foundry-public
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      FOUNDRY_DEPLOYMENT_PROFILE_B64: ${{ vars.FOUNDRY_DEPLOYMENT_PROFILE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/underwriting/foundry-public/backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agents/underwriting/foundry-public/frontend/package-lock.json
      - name: Install observability dependencies
        working-directory: agents/underwriting/foundry-public
        run: |
          make install
          make frontend-install
          (cd frontend && npx playwright install --with-deps chromium)
      - name: Materialize the protected non-secret deployment profile
        working-directory: agents/underwriting/foundry-public
        run: |
          set -euo pipefail
          : "${FOUNDRY_DEPLOYMENT_PROFILE_B64:?Set the protected FOUNDRY_DEPLOYMENT_PROFILE_B64 variable}"
          mkdir -p .artifacts/workflows
          profile="$PWD/.artifacts/workflows/foundry-public.env"
          printf '%s' "$FOUNDRY_DEPLOYMENT_PROFILE_B64" | base64 --decode >"$profile"
          bash deployment/profile.sh validate "$profile"
          profile_subscription="$(sed -n 's/^AZURE_SUBSCRIPTION_ID=//p' "$profile")"
          [[ "$profile_subscription" == "$AZURE_SUBSCRIPTION_ID" ]] || {
            echo "OIDC subscription and deployment profile subscription differ." >&2
            exit 1
          }
          echo "FOUNDRY_DEPLOYMENT_PROFILE=$profile" >> "$GITHUB_ENV"
      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Configure Azure Developer CLI authentication
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd config set auth.useAzCliAuth true
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ext install azure.ai.agents --no-prompt
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ext install azure.ai.connections --no-prompt
      - name: Apply the protected target profile
        working-directory: agents/underwriting/foundry-public
        run: make foundry-profile-apply
      - name: Hydrate and validate selected Azure resources
        working-directory: agents/underwriting/foundry-public
        run: make foundry-bootstrap
      - name: Validate App Insights connection
        working-directory: agents/underwriting/foundry-public
        run: make foundry-appinsights-connection
      - name: Generate current hosted E2E traces
        working-directory: agents/underwriting/foundry-public
        run: make foundry-hosted-e2e
      - name: Run report-only Foundry evaluation
        working-directory: agents/underwriting/foundry-public
        run: make foundry-eval
      - name: Verify correlated Application Insights telemetry
        working-directory: agents/underwriting/foundry-public
        run: make foundry-telemetry
      - name: Upload sanitized observability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: underwriting-public-observability-${{ github.run_id }}-${{ github.run_attempt }}
          path: agents/underwriting/foundry-public/backend/.foundry/results/
          if-no-files-found: error

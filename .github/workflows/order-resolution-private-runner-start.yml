name: Order Resolution Private Runner Start

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZD_ENVIRONMENT_NAME: ${{ vars.AZURE_ENV_NAME }}
  TARGET_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  TARGET_FOUNDRY_PROJECT: ${{ vars.FOUNDRY_PROJECT_NAME }}
  TARGET_POSTGRES_DATABASE: ${{ vars.POSTGRES_DATABASE_NAME }}
  PRIVATE_RUNNER_VM_NAME: ${{ vars.PRIVATE_RUNNER_VM_NAME }}
  PRIVATE_RUNNER_LABEL: ${{ vars.PRIVATE_RUNNER_LABEL }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  start-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub target variables against the canonical profile
        run: agents/order-resolution/foundry-private/scripts/github/validate_github_profile_mirror.sh
      - name: Authenticate with the deployment environment's federated Azure identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Start the existing private runner VM
        run: |
          set -euo pipefail
          az vm start \
            --resource-group "$TARGET_RESOURCE_GROUP" \
            --name "$PRIVATE_RUNNER_VM_NAME" \
            --no-wait
          for attempt in $(seq 1 30); do
            state="$(az vm get-instance-view \
              --resource-group "$TARGET_RESOURCE_GROUP" \
              --name "$PRIVATE_RUNNER_VM_NAME" \
              --query "instanceView.statuses[?code=='PowerState/running'].code | [0]" \
              --output tsv)"
            if [[ "$state" == "PowerState/running" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Private runner VM did not reach PowerState/running within five minutes."
          exit 1
      - name: Confirm the private runner VM remains running
        run: |
          set -euo pipefail
          state="$(az vm get-instance-view \
            --resource-group "$TARGET_RESOURCE_GROUP" \
            --name "$PRIVATE_RUNNER_VM_NAME" \
            --query "instanceView.statuses[?code=='PowerState/running'].code | [0]" \
            --output tsv)"
          [[ "$state" == "PowerState/running" ]]
          echo "Private runner VM is running. The protected release job provides GitHub runner readiness evidence."

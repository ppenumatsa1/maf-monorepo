name: Underwriting Public CI

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/underwriting/foundry-public/**"
      - ".github/workflows/*underwriting*.yml"
  push:
    branches: [main]
    paths:
      - "agents/underwriting/foundry-public/**"
      - ".github/workflows/*underwriting*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: underwriting-public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Resolve focused contract paths
    runs-on: ubuntu-latest
    outputs:
      teams: ${{ steps.paths.outputs.teams }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Teams contract changes
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "teams=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before || '' }}" &&
                  "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          changed_files="$(git diff --name-only "$base_ref" "$GITHUB_SHA")"
          if grep -Eiq \
            '^agents/underwriting/foundry-public/(backend/foundry/|backend/app/.*(teams|activity)|infra/foundry-hosted/(azure\.yaml|iac/teams/|teams-publication\.json)|scripts/foundry/.*(teams|activity)|Makefile$)|^\.github/workflows/.*underwriting.*\.yml$' \
            <<<"$changed_files"; then
            echo "teams=true" >> "$GITHUB_OUTPUT"
          else
            echo "teams=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: Python lint, format, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/underwriting/foundry-public/backend/requirements-dev.lock
      - name: Install Python dependencies
        working-directory: agents/underwriting/foundry-public
        run: make install
      - name: Run Python lint and format checks
        working-directory: agents/underwriting/foundry-public
        run: make lint-backend format-check
      - name: Run Python tests
        working-directory: agents/underwriting/foundry-public
        run: make test-backend

  frontend:
    name: Frontend clean install, build, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agents/underwriting/foundry-public/frontend/package-lock.json
      - name: Clean install frontend dependencies
        working-directory: agents/underwriting/foundry-public/frontend
        run: npm ci
      - name: Build frontend
        working-directory: agents/underwriting/foundry-public/frontend
        run: npm run build
      - name: Lint frontend
        working-directory: agents/underwriting/foundry-public/frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: agents/underwriting/foundry-public/frontend
        run: npm run test

  contracts:
    name: Script and deployment-profile contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/underwriting/foundry-public/backend/requirements-dev.lock
      - name: Install Python dependencies
        working-directory: agents/underwriting/foundry-public
        run: make install
      - name: Run script contracts
        working-directory: agents/underwriting/foundry-public
        run: make test-scripts
      - name: Run deployment-profile contracts
        working-directory: agents/underwriting/foundry-public
        run: make test-deployment-profile

  bicep:
    name: Compile Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Underwriting Foundry infrastructure
        working-directory: agents/underwriting/foundry-public
        run: make foundry-iac-build

  package-contract:
    name: Validate release package context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/underwriting/foundry-public/backend/requirements.lock
      - name: Validate hosted and application package context
        working-directory: agents/underwriting/foundry-public
        run: make foundry-release-package

  teams-contracts:
    name: Focused Teams contracts
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.teams == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/underwriting/foundry-public/backend/requirements-dev.lock
      - name: Install Python dependencies
        working-directory: agents/underwriting/foundry-public
        run: make install
      - name: Run available Teams contracts
        working-directory: agents/underwriting/foundry-public
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/workflows
          make -qp >.artifacts/workflows/make-database.txt 2>/dev/null || true
          if grep -q '^test-foundry-teams-publishing:' .artifacts/workflows/make-database.txt; then
            make test-foundry-teams-publishing
            exit 0
          fi

          ran_contracts=false
          if compgen -G 'scripts/foundry/tests/*teams*.py' >/dev/null; then
            python -m unittest discover -s scripts/foundry/tests -p '*teams*.py'
            ran_contracts=true
          fi
          if compgen -G 'scripts/foundry/tests/*activity*.py' >/dev/null; then
            python -m unittest discover -s scripts/foundry/tests -p '*activity*.py'
            ran_contracts=true
          fi
          if [[ "$ran_contracts" == "false" ]]; then
            echo "No executable Teams contracts are present in this source revision."
          fi

          # Shared Microsoft 365 publication intentionally stays outside OIDC:
          # delegated user authentication must remain an interactive operator step.

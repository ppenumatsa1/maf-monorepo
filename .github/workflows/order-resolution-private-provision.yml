name: Order Resolution Private Provision

on:
  workflow_dispatch:
    inputs:
      provision_no_state:
        description: Run azd provision with --no-state.
        required: true
        type: boolean
        default: false
      preview_only:
        description: Run the private infrastructure preview without applying changes.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: order-resolution-private-release
  cancel-in-progress: false

env:
  AZD_ENVIRONMENT_NAME: ${{ vars.AZURE_ENV_NAME }}
  TARGET_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  TARGET_FOUNDRY_PROJECT: ${{ vars.FOUNDRY_PROJECT_NAME }}
  TARGET_POSTGRES_DATABASE: ${{ vars.POSTGRES_DATABASE_NAME }}
  PRIVATE_RUNNER_LABEL: ${{ vars.PRIVATE_RUNNER_LABEL }}
  PRIVATE_RUNNER_VM_NAME: ${{ vars.PRIVATE_RUNNER_VM_NAME }}

jobs:
  provision:
    runs-on: [self-hosted, "${{ vars.PRIVATE_RUNNER_LABEL }}"]
    defaults:
      run:
        shell: bash
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Validate GitHub target variables against the canonical profile
        run: agents/order-resolution/foundry-private/scripts/github/validate_github_profile_mirror.sh
      - name: Clean workspace while retaining the private azd environment
        run: git clean -ffdx -e agents/order-resolution/foundry-private/infra/foundry-hosted/.azure/
      - name: Authenticate with the runner's federated Azure identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Configure azd for Azure CLI OIDC authentication
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd config set auth.useAzCliAuth true
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ext install azure.ai.agents --no-prompt
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ext install azure.ai.connections --no-prompt
      - name: Reconstruct private AZD environment
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: agents/order-resolution/foundry-private/scripts/foundry/bootstrap_private_azd_environment.sh
      - name: Initialize missing private release defaults
        run: |
          set -euo pipefail
          (
            cd agents/order-resolution/foundry-private/infra/foundry-hosted
            AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd env select "$AZD_ENVIRONMENT_NAME" --no-prompt
          )
          agents/order-resolution/foundry-private/scripts/foundry/ensure_foundry_azd_defaults.sh
      - name: Verify the selected private deployment environment
        run: agents/order-resolution/foundry-private/scripts/foundry/validate_private_runner_environment.sh
      - name: Preview private Foundry infrastructure changes
        working-directory: agents/order-resolution/foundry-private
        run: make foundry-provision-preview
      - name: Provision private Foundry infrastructure
        if: ${{ inputs.preview_only != true }}
        working-directory: agents/order-resolution/foundry-private
        run: |
          set -euo pipefail
          if [[ "${{ inputs.provision_no_state }}" == "true" ]]; then
            FOUNDRY_PROVISION_NO_STATE=true make foundry-provision
          else
            make foundry-provision
          fi
      - name: Re-verify canonical private deployment environment
        run: agents/order-resolution/foundry-private/scripts/foundry/validate_private_runner_environment.sh

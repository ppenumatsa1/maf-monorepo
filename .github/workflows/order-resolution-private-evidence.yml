name: Order Resolution Private Release Evidence

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select collect to run fresh hosted smoke, E2E, evaluation, and telemetry evidence.
        required: true
        type: choice
        default: cancel
        options: [cancel, collect]

permissions:
  contents: read
  id-token: write

concurrency:
  group: order-resolution-private-release
  cancel-in-progress: false

env:
  AZD_ENVIRONMENT_NAME: foundry-private-env
  TARGET_RESOURCE_GROUP: rg-maf-ora-foundry-v2
  TARGET_FOUNDRY_PROJECT: order-resolution
  TARGET_POSTGRES_DATABASE: maf_workflow

jobs:
  evidence:
    if: ${{ inputs.confirmation == 'collect' }}
    runs-on: [self-hosted, foundry-private-v2]
    environment: foundry-private-env
    defaults:
      run:
        shell: bash
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean workspace while retaining the private azd environment
        run: git clean -ffdx -e agents/order-resolution/foundry-private/infra/foundry-hosted/.azure/
      - name: Authenticate with the runner's federated Azure identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Configure private azd environment
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          azd config set auth.useAzCliAuth true
          azd ext install azure.ai.agents --no-prompt
          azd ext install azure.ai.connections --no-prompt
      - name: Reconstruct private AZD environment
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: agents/order-resolution/foundry-private/scripts/foundry/bootstrap_private_azd_environment.sh
      - name: Validate private runner target
        run: agents/order-resolution/foundry-private/scripts/foundry/validate_private_runner_environment.sh
      - name: Collect release evidence
        working-directory: agents/order-resolution/foundry-private
        run: make foundry-evidence

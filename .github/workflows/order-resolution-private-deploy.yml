name: Order Resolution Private App-only Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: order-resolution-private-release
  cancel-in-progress: false

env:
  AZD_CONFIG_DIR: /mnt/.azd
  AZD_ENVIRONMENT_NAME: ${{ vars.AZURE_ENV_NAME }}
  TARGET_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  TARGET_FOUNDRY_PROJECT: ${{ vars.FOUNDRY_PROJECT_NAME }}
  TARGET_POSTGRES_DATABASE: ${{ vars.POSTGRES_DATABASE_NAME }}
  PRIVATE_RUNNER_LABEL: ${{ vars.PRIVATE_RUNNER_LABEL }}
  PRIVATE_RUNNER_VM_NAME: ${{ vars.PRIVATE_RUNNER_VM_NAME }}

jobs:
  deploy:
    runs-on: [self-hosted, "${{ vars.PRIVATE_RUNNER_LABEL }}"]
    defaults:
      run:
        shell: bash
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Validate GitHub target variables against the canonical profile
        run: agents/order-resolution/foundry-private/scripts/github/validate_github_profile_mirror.sh
      - name: Set up Python for hosted-agent deployment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean workspace while retaining the private azd environment
        run: git clean -ffdx -e agents/order-resolution/foundry-private/infra/foundry-hosted/.azure/
      - name: Authenticate with the runner's federated Azure identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Configure azd for Azure CLI OIDC authentication
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd config set auth.useAzCliAuth true
      - name: Validate existing private dependencies and deploy app-only release
        working-directory: agents/order-resolution/foundry-private
        run: make foundry-app-only-release

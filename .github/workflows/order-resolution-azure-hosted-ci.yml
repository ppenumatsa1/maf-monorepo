name: Order Resolution Azure-Hosted CI

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/order-resolution/azure-hosted/**"
      - ".github/workflows/order-resolution-azure-hosted-ci.yml"
  push:
    branches: [main]
    paths:
      - "agents/order-resolution/azure-hosted/**"
      - ".github/workflows/order-resolution-azure-hosted-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  routing:
    name: Operating model routing
    runs-on: ubuntu-latest
    outputs:
      validation_mode: ${{ steps.route.outputs.validation_mode }}
      deploy_mode: ${{ steps.route.outputs.deploy_mode }}
      router_reason: ${{ steps.route.outputs.router_reason }}
      base_ref: ${{ steps.base.outputs.base_ref }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_started_at: ${{ steps.release.outputs.release_started_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve diff base
        id: base
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before || '' }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="HEAD~1"
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
      - name: Resolve canonical release identity
        id: release
        run: |
          set -euo pipefail
          echo "release_id=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "release_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Route validation/deploy mode
        id: route
        run: |
          set -euo pipefail
          if git diff --name-only "${{ steps.base.outputs.base_ref }}" HEAD -- .github/workflows/order-resolution-azure-hosted-ci.yml | grep -qx '.github/workflows/order-resolution-azure-hosted-ci.yml'; then
            routing_output=$'deploy_mode=app_only\nvalidation_mode=full\nreconcile_indicator=review_required\nreason=azure_hosted_release_workflow_changed'
          else
            routing_output="$(agents/order-resolution/azure-hosted/scripts/skills/deployment-mode-router.sh "${{ steps.base.outputs.base_ref }}")"
          fi
          echo "$routing_output"
          validation_mode="$(grep '^validation_mode=' <<<"$routing_output" | head -n1 | cut -d= -f2)"
          deploy_mode="$(grep '^deploy_mode=' <<<"$routing_output" | head -n1 | cut -d= -f2)"
          router_reason="$(grep '^reason=' <<<"$routing_output" | head -n1 | cut -d= -f2)"
          echo "validation_mode=$validation_mode" >> "$GITHUB_OUTPUT"
          echo "deploy_mode=$deploy_mode" >> "$GITHUB_OUTPUT"
          echo "router_reason=$router_reason" >> "$GITHUB_OUTPUT"

  operating-model-enforcement:
    name: Operating model enforcement
    runs-on: ubuntu-latest
    needs: routing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce operating model guardrails
        run: agents/order-resolution/azure-hosted/scripts/skills/operating-model-enforcement.sh "${{ needs.routing.outputs.base_ref }}"

  release-assets:
    name: Release asset and credential-free reconciliation mock
    runs-on: ubuntu-latest
    needs: [routing, operating-model-enforcement]
    env:
      RELEASE_ID: ${{ needs.routing.outputs.release_id }}
      RELEASE_RUN_ID: ${{ needs.routing.outputs.release_id }}
      RELEASE_STARTED_AT: ${{ needs.routing.outputs.release_started_at }}
      RELEASE_E2E_STARTED_AT: ${{ needs.routing.outputs.release_started_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure Bicep CLI
        run: |
          set -euo pipefail
          if ! command -v bicep >/dev/null 2>&1; then
            az bicep install --only-show-errors
            echo "$HOME/.azure/bin" >> "$GITHUB_PATH"
          fi
      - name: Ensure preflight Python helpers
        run: python3 -c "import jsonschema" >/dev/null 2>&1 || python3 -m pip install --quiet jsonschema
      - name: Prepare canonical release context
        working-directory: agents/order-resolution/azure-hosted
        run: make release-profile-apply
      - name: Run canonical release preflight
        working-directory: agents/order-resolution/azure-hosted
        run: make release-preflight
      - name: Upload canonical release preflight bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: azure-hosted-release-preflight-${{ needs.routing.outputs.release_id }}
          path: agents/order-resolution/azure-hosted/.artifacts/releases/${{ needs.routing.outputs.release_id }}/
          if-no-files-found: error

  backend:
    name: Backend lint, tests, and evals
    runs-on: ubuntu-latest
    needs: [routing, operating-model-enforcement]
    if: ${{ needs.routing.outputs.validation_mode == 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: agents/order-resolution/azure-hosted/backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
      - name: Run backend lint and tests
        working-directory: agents/order-resolution/azure-hosted
        run: make test
      - name: Run backend evals
        working-directory: agents/order-resolution/azure-hosted
        run: make eval-backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [routing, operating-model-enforcement]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agents/order-resolution/azure-hosted/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: agents/order-resolution/azure-hosted/frontend
      - name: Build frontend
        run: npm run build
        working-directory: agents/order-resolution/azure-hosted/frontend

  browser-e2e:
    name: Browser E2E workflow and selected thread
    runs-on: ubuntu-latest
    needs: [routing, operating-model-enforcement]
    if: ${{ needs.routing.outputs.validation_mode == 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            agents/order-resolution/azure-hosted/frontend/package-lock.json
            agents/order-resolution/azure-hosted/scripts/playwright/package-lock.json
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-azure-hosted-playwright-${{ hashFiles('agents/order-resolution/azure-hosted/scripts/playwright/package-lock.json') }}
      - name: Install backend dependencies
        working-directory: agents/order-resolution/azure-hosted/backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: agents/order-resolution/azure-hosted/frontend
        run: npm ci
      - name: Install Playwright dependencies and browser
        working-directory: agents/order-resolution/azure-hosted/scripts/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run focused selected-thread browser E2E
        working-directory: agents/order-resolution/azure-hosted
        run: make test-e2e-selected
      - name: Run workflow and selected-thread browser E2E
        working-directory: agents/order-resolution/azure-hosted
        run: make test-e2e

  release-image-cache:
    name: Prebuild immutable release image cache
    runs-on: ubuntu-latest
    environment: maf-ora-azure
    needs: [routing, operating-model-enforcement]
    if: ${{ needs.routing.outputs.validation_mode == 'full' }}
    env:
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Define immutable release images
        id: images
        run: |
          set -euo pipefail
          release_tag="ci-${GITHUB_SHA}"
          backend_image="${AZURE_CONTAINER_REGISTRY_ENDPOINT}/maf-order-resolution-agent/backend-maf-ora-azure:${release_tag}"
          frontend_image="${AZURE_CONTAINER_REGISTRY_ENDPOINT}/maf-order-resolution-agent/frontend-maf-ora-azure:${release_tag}"
          echo "backend_image=${backend_image}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${frontend_image}" >> "$GITHUB_OUTPUT"
      - name: Prebuild unpushed backend image cache
        uses: docker/build-push-action@v6
        with:
          context: agents/order-resolution/azure-hosted/backend
          load: false
          push: false
          tags: ${{ steps.images.outputs.backend_image }}
          cache-from: type=gha,scope=order-resolution-azure-hosted-backend
          cache-to: type=gha,mode=max,scope=order-resolution-azure-hosted-backend,ignore-error=true
      - name: Prebuild unpushed frontend image cache
        uses: docker/build-push-action@v6
        with:
          context: agents/order-resolution/azure-hosted/frontend
          load: false
          push: false
          tags: ${{ steps.images.outputs.frontend_image }}
          cache-from: type=gha,scope=order-resolution-azure-hosted-frontend
          cache-to: type=gha,mode=max,scope=order-resolution-azure-hosted-frontend,ignore-error=true

  docker-e2e:
    name: Required cloud Docker E2E
    runs-on: ubuntu-latest
    environment: maf-ora-azure
    concurrency:
      group: order-resolution-azure-hosted-release-${{ github.ref }}
      cancel-in-progress: false
    needs:
      [
        routing,
        operating-model-enforcement,
        release-assets,
        backend,
        frontend,
        browser-e2e,
        design-review,
        release-image-cache,
      ]
    if: ${{ needs.routing.outputs.validation_mode == 'full' }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      RELEASE_ID: ${{ needs.routing.outputs.release_id }}
      RELEASE_RUN_ID: ${{ needs.routing.outputs.release_id }}
      RELEASE_STARTED_AT: ${{ needs.routing.outputs.release_started_at }}
      RELEASE_E2E_STARTED_AT: ${{ needs.routing.outputs.release_started_at }}
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical release preflight bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/download-artifact@v4
        with:
          name: azure-hosted-release-preflight-${{ needs.routing.outputs.release_id }}
          path: agents/order-resolution/azure-hosted/.artifacts/releases/${{ needs.routing.outputs.release_id }}
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate the app-only release identity
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            agents/order-resolution/azure-hosted/frontend/package-lock.json
            agents/order-resolution/azure-hosted/scripts/playwright/package-lock.json
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-azure-hosted-playwright-${{ hashFiles('agents/order-resolution/azure-hosted/scripts/playwright/package-lock.json') }}
      - name: Install frontend dependencies
        working-directory: agents/order-resolution/azure-hosted/frontend
        run: npm ci
      - name: Install Playwright dependencies and browser
        working-directory: agents/order-resolution/azure-hosted/scripts/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the immutable release images
        id: release-images
        run: |
          set -euo pipefail
          release_tag="ci-${GITHUB_SHA}"
          backend_image="${AZURE_CONTAINER_REGISTRY_ENDPOINT}/maf-order-resolution-agent/backend-maf-ora-azure:${release_tag}"
          frontend_image="${AZURE_CONTAINER_REGISTRY_ENDPOINT}/maf-order-resolution-agent/frontend-maf-ora-azure:${release_tag}"
          echo "BACKEND_IMAGE=${backend_image}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${frontend_image}" >> "$GITHUB_ENV"
          echo "backend_image=${backend_image}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${frontend_image}" >> "$GITHUB_OUTPUT"
      - name: Build immutable backend image
        uses: docker/build-push-action@v6
        with:
          context: agents/order-resolution/azure-hosted/backend
          load: true
          push: false
          tags: ${{ steps.release-images.outputs.backend_image }}
          cache-from: type=gha,scope=order-resolution-azure-hosted-backend
          cache-to: type=gha,mode=max,scope=order-resolution-azure-hosted-backend,ignore-error=true
      - name: Build immutable frontend image
        uses: docker/build-push-action@v6
        with:
          context: agents/order-resolution/azure-hosted/frontend
          load: true
          push: false
          tags: ${{ steps.release-images.outputs.frontend_image }}
          cache-from: type=gha,scope=order-resolution-azure-hosted-frontend
          cache-to: type=gha,mode=max,scope=order-resolution-azure-hosted-frontend,ignore-error=true
      - name: Run Docker E2E profile
        working-directory: agents/order-resolution/azure-hosted
        run: BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" make docker-test
      - name: Publish Docker E2E failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: azure-hosted-docker-e2e-diagnostics-${{ github.run_id }}
          path: |
            agents/order-resolution/azure-hosted/scripts/playwright/test-results/
            agents/order-resolution/azure-hosted/frontend/test-results/
          if-no-files-found: warn
      - name: Deploy the tested immutable images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: agents/order-resolution/azure-hosted
        run: make deploy-ci-images
      - uses: actions/setup-python@v5
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          python-version: "3.12"
      - uses: Azure/setup-azd@v2
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install release-validation dependencies
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: agents/order-resolution/azure-hosted/backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
      - name: Reconstruct release validation configuration
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: agents/order-resolution/azure-hosted
        run: ./scripts/release/bootstrap-ci-azd-environment.sh
      - name: Validate hosted release and aggregate final evidence
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: agents/order-resolution/azure-hosted
        run: make release-validate
      - name: Publish sanitized release evidence
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: azure-hosted-release-${{ needs.routing.outputs.release_id }}
          path: agents/order-resolution/azure-hosted/.artifacts/releases/${{ needs.routing.outputs.release_id }}/
          if-no-files-found: warn

  design-review:
    name: Deterministic design-review gate
    runs-on: ubuntu-latest
    needs: [routing, operating-model-enforcement]
    if: ${{ needs.routing.outputs.validation_mode == 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-azure-hosted-playwright-${{ hashFiles('agents/order-resolution/azure-hosted/scripts/playwright/package-lock.json') }}
      - name: Install frontend dependencies
        working-directory: agents/order-resolution/azure-hosted/frontend
        run: npm ci
      - name: Install Playwright dependencies and browser
        working-directory: agents/order-resolution/azure-hosted/scripts/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run design-review gate
        run: agents/order-resolution/azure-hosted/scripts/skills/design-review-skill.sh

  quick-validation:
    name: Quick validation gate
    runs-on: ubuntu-latest
    needs: [routing, operating-model-enforcement]
    if: ${{ needs.routing.outputs.validation_mode == 'quick' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            agents/order-resolution/azure-hosted/frontend/package-lock.json
            agents/order-resolution/azure-hosted/scripts/playwright/package-lock.json
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-azure-hosted-playwright-${{ hashFiles('agents/order-resolution/azure-hosted/scripts/playwright/package-lock.json') }}
      - name: Install backend dependencies
        working-directory: agents/order-resolution/azure-hosted/backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: agents/order-resolution/azure-hosted/frontend
        run: npm ci
      - name: Install Playwright dependencies
        working-directory: agents/order-resolution/azure-hosted/scripts/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run quick validation
        working-directory: agents/order-resolution/azure-hosted
        run: make validate-quick

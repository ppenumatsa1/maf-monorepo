name: Order Resolution Private Package Validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select validate to build private release packages without publishing or deploying them.
        required: true
        type: choice
        default: cancel
        options: [cancel, validate]

permissions:
  contents: read
  id-token: write

concurrency:
  group: order-resolution-private-release
  cancel-in-progress: false

env:
  AZD_ENVIRONMENT_NAME: foundry-private-env
  TARGET_RESOURCE_GROUP: rg-maf-ora-foundry-v2
  TARGET_FOUNDRY_PROJECT: order-resolution
  TARGET_POSTGRES_DATABASE: maf_workflow

jobs:
  package:
    if: ${{ inputs.confirmation == 'validate' }}
    runs-on: [self-hosted, foundry-private-v2]
    environment: foundry-private-env
    defaults:
      run:
        shell: bash
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Clean workspace while retaining the private azd environment
        run: git clean -ffdx -e agents/order-resolution/foundry-private/infra/foundry-hosted/.azure/
      - name: Authenticate with the runner's federated Azure identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Configure azd for Azure CLI OIDC authentication
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          azd config set auth.useAzCliAuth true
      - name: Validate existing private app-release dependencies
        working-directory: agents/order-resolution/foundry-private
        run: make foundry-app-only-preflight
      - name: Sync hosted-agent package context
        working-directory: agents/order-resolution/foundry-private
        run: ./scripts/foundry/sync_hosted_source.sh
      - name: Package private release images without publishing
        working-directory: agents/order-resolution/foundry-private/infra/foundry-hosted
        run: azd package --no-prompt

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: maf-order-resolution-foundry-hosted
services:
    backend:
        project: ../../backend
        host: containerapp
        language: python
    frontend:
        project: ../../frontend
        host: containerapp
        language: js
        uses:
            - backend
    order-resolution-hosted:
        project: ./agent
        host: azure.ai.agent
        language: docker
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Order Resolution private hosted workflow agent.
        kind: hosted
        name: order-resolution-hosted
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: python -m foundry.main
infra:
    provider: bicep
    path: ./iac
